org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# AGP 8.x: no new-DSL, no built-in Kotlin — the Kotlin plugin is applied
# explicitly in app/build.gradle.kts and transitively by Firebase + share
# plugins. See android/settings.gradle.kts for the AGP pin rationale.
android.newDsl=false
android.builtInKotlin=false
